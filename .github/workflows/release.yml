name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and attach the vsix without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Hoisted to the job so the publish steps can test for them in `if:`.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - name: Package
        id: package
        run: |
          pnpm run package
          echo "vsix=$(ls -1 ./*.vsix | head -1)" >> "$GITHUB_OUTPUT"

      # The GitHub release comes first. It is the durable artefact -- a downloadable
      # vsix for Cursor and anyone else without a marketplace -- and it should not
      # be held hostage by a registry being down, which is exactly what happened to
      # v1.4.1 when Open VSX returned 503.
      #
      # Release notes are the CHANGELOG section for this version rather than a list
      # of commit subjects, so the tag and the changelog cannot say different things.
      - name: Collect the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo 'body<<CHANGELOG_EOF'
            ./scripts/changelog-section.sh "$version"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attach the vsix to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.vsix }}
          body: ${{ steps.notes.outputs.body }}

      # Publishing is skipped rather than failed when a token is absent, so the
      # workflow stays useful in a fork that has no credentials. An already-published
      # version is treated as success so a re-run after a partial failure converges
      # instead of tripping over the half that worked.
      - name: Publish to the Visual Studio Marketplace
        if: ${{ inputs.dry-run != true && env.VSCE_PAT != '' }}
        run: ./scripts/publish.sh marketplace "${{ steps.package.outputs.vsix }}"

      - name: Publish to Open VSX
        if: ${{ inputs.dry-run != true && env.OVSX_PAT != '' }}
        run: ./scripts/publish.sh openvsx "${{ steps.package.outputs.vsix }}"
